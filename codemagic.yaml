workflows:
  radhika-cab-android:
    name: Radhika Cab GPS Fare Meter
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Verify build tools
        script: |
          java -version
          gradle --version
      - name: Build debug APK
        script: |
          gradle --no-daemon clean assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
